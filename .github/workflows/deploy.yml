name: Build and deploy evdeki

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: evdeki-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: evdeki
  BUN_VERSION: 1.3.14

jobs:
  build-and-trigger:
    environment: evdeki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js application
        run: bun run build

      - name: Create deployment package
        shell: bash
        run: |
          set -Eeuo pipefail

          PACKAGE_DIR=".deploy/package"
          ARCHIVE=".deploy/release.tar.gz"

          mkdir -p "$PACKAGE_DIR/.next"

          cp -a .next/standalone/. "$PACKAGE_DIR/"
          cp -a .next/static "$PACKAGE_DIR/.next/static"
          if [ -d public ]; then
            cp -a public "$PACKAGE_DIR/public"
          fi

          test -f "$PACKAGE_DIR/server.js"
          test -d "$PACKAGE_DIR/.next/static"
          test -d "$PACKAGE_DIR/node_modules"

          tar -C "$PACKAGE_DIR" -czf "$ARCHIVE" .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: .deploy/release.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Trigger evdeki deploy hook
        shell: bash
        env:
          DEPLOY_URL: ${{ vars.EVDEKI_DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.EVDEKI_DEPLOY_SECRET }}
          ARTIFACT_NAME: ${{ env.APP_NAME }}-${{ github.sha }}
        run: |
          set -Eeuo pipefail

          BODY="$(jq -nc \
            --arg app "$APP_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg artifact "$ARTIFACT_NAME" \
            --argjson runId "$GITHUB_RUN_ID" \
            '{
              app: $app,
              repository: $repository,
              sha: $sha,
              artifact: $artifact,
              runId: $runId
            }')"

          SIGNATURE="$(printf '%s' "$BODY" \
            | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" \
            | awk '{print $2}')"

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST "$DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "X-Evdeki-Signature: sha256=$SIGNATURE" \
            --data-binary "$BODY"