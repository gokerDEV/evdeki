name: Build and deploy evdeki

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: evdeki-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  APP_NAME: evdeki
  BUN_VERSION: 1.3.14

jobs:
  build-and-trigger:
    environment: evdeki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun and Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-next-${{ hashFiles('bun.lock', 'next.config.*', 'package.json', 'src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-next-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js application
        run: bun run build

      - name: Create standalone artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          PACKAGE_DIR=".deploy/package"
          ARCHIVE=".deploy/release.tar.gz"

          rm -rf .deploy
          mkdir -p "$PACKAGE_DIR/.next"

          cp -r .next/standalone/. "$PACKAGE_DIR/"
          cp -r .next/static "$PACKAGE_DIR/.next/static"
          cp -r public "$PACKAGE_DIR/public"
          cp pm2.config.cjs "$PACKAGE_DIR/pm2.config.cjs"

          test -f "$PACKAGE_DIR/server.js"
          test -f "$PACKAGE_DIR/package.json"
          test -f "$PACKAGE_DIR/pm2.config.cjs"
          test -f "$PACKAGE_DIR/.next/BUILD_ID"
          test -d "$PACKAGE_DIR/node_modules"
          test -d "$PACKAGE_DIR/.next/server"
          test -d "$PACKAGE_DIR/.next/static"
          test -d "$PACKAGE_DIR/public"

          tar -C "$PACKAGE_DIR" -czf "$ARCHIVE" .

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: .deploy/release.tar.gz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Trigger deployment
        shell: bash
        env:
          DEPLOY_URL: ${{ vars.EVDEKI_DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.EVDEKI_DEPLOY_SECRET }}
          ARTIFACT_NAME: ${{ env.APP_NAME }}-${{ github.sha }}
        run: |
          set -Eeuo pipefail

          BODY="$(jq -nc \
            --arg app "$APP_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg artifact "$ARTIFACT_NAME" \
            --argjson runId "$GITHUB_RUN_ID" \
            '{
              app: $app,
              repository: $repository,
              sha: $sha,
              artifact: $artifact,
              runId: $runId
            }')"

          SIGNATURE="$(printf '%s' "$BODY" \
            | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" \
            | awk '{print $2}')"

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST "$DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "X-Evdeki-Signature: sha256=$SIGNATURE" \
            --data-binary "$BODY"